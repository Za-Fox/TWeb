<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Galerie - Face Off Bar</title>

  <link rel="stylesheet" href="galerie.css" />
</head>

<body>
<div class="top-line"></div>

<header>
  <h1>Galerie</h1>
</header>

<nav>
  <a href="acasa.html">Acasă</a>
  <a href="meniu.html">Meniu</a>
  <a href="galerie.html">Galerie</a>
  <a href="contact.html">Contact</a>
</nav>

<div class="container">

  <div class="slider">

    <input type="radio" name="slides" id="s1" checked>
    <input type="radio" name="slides" id="s2">
    <input type="radio" name="slides" id="s3">

    <div class="track">

      <div class="slide">
        <div class="pic"><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSpYlj3xAFqbd1OhoXLxxeuSZls-KjlrJcevw&s" alt="Galerie 1"></div>
        <div class="pic"><img src="https://i.simpalsmedia.com/afisha.md/places/original/fdb33e3db6f4f62ae16836732c929a16.png" alt="Galerie 2"></div>
        <div class="pic"><img src="https://avatars.mds.yandex.net/get-altay/10142335/2a0000018b2994d97b4009cd4691d8a3bd17/L_height" alt="Galerie 3"></div>
      </div>

      <div class="slide">
        <div class="pic"><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQH-xlgYvDmqTMqhD-gPzTjXO9p9Nsq3fP1Cg&s" alt="Galerie 4"></div>
        <div class="pic"><img src="https://avatars.mds.yandex.net/get-altay/9704097/2a0000018b2992a302250dae699ebc35db60/L_height" alt="Galerie 5"></div>
        <div class="pic"><img src="https://avatars.mds.yandex.net/get-altay/6506385/2a0000018b29949ac71d37ceb3662033bf82/L_height" alt="Galerie 6"></div>
      </div>

      <div class="slide">
        <div class="pic"><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSNXMVRTFMarOOH-t4Yd1byiaazxxbhXMlRVg&s" alt="Galerie 7"></div>
        <div class="pic"><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRxNIAQ7onD6_2cizWxG-dOIWuQPuMSyIu42Q&s" alt="Galerie 8"></div>
        <div class="pic"><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQ9a7MSbuvOj_WP7YxzPzikMerLAM2Iaf_iIQ&s" alt="Galerie 9"></div>
      </div>

    </div>

    <div class="controls">
      <label class="arrow prev p1" for="s3">&#x2039;</label>
      <label class="arrow prev p2" for="s1">&#x2039;</label>
      <label class="arrow prev p3" for="s2">&#x2039;</label>

      <label class="arrow next n1" for="s2">&#x203A;</label>
      <label class="arrow next n2" for="s3">&#x203A;</label>
      <label class="arrow next n3" for="s1">&#x203A;</label>
    </div>

    <div class="dots">
      <div class="dot d1"></div>
      <div class="dot d2"></div>
      <div class="dot d3"></div>
    </div>
  </div>

</div>
</body>
</html>
